<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>·</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --paper: #f4efe6; --card: #fbf8f2; --ink: #1d1a16; --ink-2: #5d564c; --accent: #c2502e; --rule: #d6cdbd;
  --serif: "Fraunces", Georgia, serif; --sans: "Manrope", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --paper: #15130f; --card: #1d1a15; --ink: #efe8dc; --ink-2: #b3aa9b; --accent: #e07a55; --rule: #38322a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--sans); }
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lock[hidden] { display: none; }
form { width: min(420px, 100%); text-align: center; }
h1 { font: 400 clamp(34px, 7vw, 52px)/1.05 var(--serif); margin: 0 0 20px; }
input { width: 100%; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 4px; background: var(--card); color: var(--ink);
  font: 500 17px/1.2 var(--sans); text-align: center; letter-spacing: .08em; }
button { margin-top: 12px; width: 100%; padding: 13px; border: 0; border-radius: 4px; background: var(--accent); color: #fff;
  font: 600 16px/1.2 var(--sans); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { min-height: 22px; margin-top: 12px; color: var(--accent); font-size: 14px; }
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form id="f" autocomplete="off">
    <h1>Ключ</h1>
    <input id="k" type="text" spellcheck="false" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX" aria-label="Ключ">
    <button type="submit" id="go">Открыть</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
// Корень сайта: ключ от «Всех альбомов». Проверяем его здесь же (расшифровываем список) и переходим туда.
// Сам список и ключ на этой странице не хранятся: всё берётся из albums/ и проверяется в браузере.
(() => {
  const $ = id => document.getElementById(id);
  const base = location.pathname.replace(/[^/]*$/, "");            // "/" на Cloudflare, "/photosz/" на GitHub
  const store = "albumkey:" + base + "albums/";                    // тот же ключ, что запоминает сама страница списка
  const norm = k => (k || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  let cfg = null;
  async function check(k) {
    if (!cfg) {
      const html = await (await fetch(base + "albums/", {cache: "no-cache"})).text();
      cfg = JSON.parse(new DOMParser().parseFromString(html, "text/html").getElementById("cfg").textContent);
    }
    const enc = new TextEncoder();
    const raw = await crypto.subtle.importKey("raw", enc.encode(norm(k)), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name: "PBKDF2", hash: "SHA-256", salt: Uint8Array.from(atob(cfg.salt), c => c.charCodeAt(0)), iterations: cfg.iter},
      raw, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    const buf = new Uint8Array(await (await fetch(base + "albums/data/" + cfg.album, {cache: "no-cache"})).arrayBuffer());
    await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, key, buf.slice(12));   // неверный ключ — исключение
  }
  const open = k => location.replace(base + "albums/#k=" + norm(k).match(/.{1,4}/g).join("-"));
  $("f").onsubmit = async e => {
    e.preventDefault();
    const k = $("k").value;
    if (!norm(k)) return;
    $("go").disabled = true; $("err").textContent = "";
    try { await check(k); open(k); }
    catch (err) { $("err").textContent = "Неверный ключ"; $("go").disabled = false; }
  };
  (async () => {                                                   // ключ уже сохранён в этом браузере — сразу туда
    const saved = get(store);
    if (saved) try { await check(saved); return open(saved); } catch (e) {}
    $("lock").hidden = false;
    $("k").focus();
  })();
})();
</script>
</body>
</html>
